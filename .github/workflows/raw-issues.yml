name: raw issues

# Keeps the issues "[raw] ..." that ask the research repository for work: one for each topic whose records research
# changed with no row of the change ledger, and one for each coverage check that holds (stale records, few records,
# unknown values, a kind of resource that no record covers). It closes each one when its condition no longer holds
# (publish/raw_issues.py, publish/publog.py, publish/rules/coverage.json). It runs after each push to main and once a
# day, so an issue does not go stale. The token can write issues only.

on:
  push:
    branches: [main]
    paths:
      - data/meta.json
      - publish/publog.py
      - publish/raw_issues.py
      - publish/rules/coverage.json
      - .github/workflows/raw-issues.yml
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: raw-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: build the store that the coverage checks read
        run: python3 publish/build.py --check --quiet

      - name: open, update and close the issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publish/raw_issues.py --sync
