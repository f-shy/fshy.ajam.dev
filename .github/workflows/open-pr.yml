name: open pr

# Opens a pull request for a pushed branch that has none, from its commits. A session pushes a branch and needs no
# tool that writes to GitHub, so no tool can add a credit line (AGENTS.md rule 2). The title and the body pass the
# commit-msg hook and the leak rules before the pull request is opened, as each commit message does.
# GitHub holds the pull_request run of a pull request that this workflow opened (action_required) until it is
# approved, and only that run gives the check build that the rules of main require. So the workflow re-runs the held
# run of the head. When GitHub refuses that, it says so in the log, and a person or a session re-runs it.

on:
  push:
    branches-ignore: [main, gh-pages, "dependabot/**"]

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: open-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    if: github.repository == 'f-shy/fshy.ajam.dev'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          base=$(git merge-base origin/main HEAD)
          if [ "$(git rev-list --count "$base..HEAD")" = 0 ]; then
            echo "the branch has no commit that main does not have"
            exit 0
          fi
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            # the title is the subject of the first commit; the body is every commit of the branch
            git log --reverse --format=%s "$base..HEAD" | head -1 > "$RUNNER_TEMP/title"
            {
              printf '## What this changes\n\n'
              git log --reverse --no-merges --format='### %s%n%n%b' "$base..HEAD"
              printf '## Checks\n\nThe workflow build runs on the head of this branch. Its job build is the check of this pull request.\n'
            } > "$RUNNER_TEMP/body"
            { cat "$RUNNER_TEMP/title"; echo; cat "$RUNNER_TEMP/body"; } > "$RUNNER_TEMP/pr"
            sh .githooks/commit-msg "$RUNNER_TEMP/pr"
            python3 publish/build.py --scan "$RUNNER_TEMP/pr"
            gh pr create --base main --head "$BRANCH" --title "$(cat "$RUNNER_TEMP/title")" --body-file "$RUNNER_TEMP/body"
          fi

      - name: re-run the held pull_request run of the head
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # the run starts a few seconds after the pull request or the push; wait for it for at most 3 minutes
          for i in $(seq 1 18); do
            run=$(gh run list --workflow build.yml --branch "$BRANCH" --event pull_request --commit "$SHA" \
                    --json databaseId,status,conclusion --jq '.[0]')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "no pull_request run of $SHA after 3 minutes"
            exit 0
          fi
          id=$(echo "$run" | jq -r .databaseId)
          if [ "$(echo "$run" | jq -r .conclusion)" != action_required ]; then
            echo "run $id is not held: $(echo "$run" | jq -c .)"
            exit 0
          fi
          if gh run rerun "$id"; then
            echo "re-ran the held run $id"
          else
            echo "::warning::GitHub refused to re-run the held run $id; a person or a session re-runs it"
          fi
